<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hausbild</title>
<!-- Treiber für tools/houseshot.sh: lädt die gebaute Seite (docs/index.html) im Rahmen, stellt die Kamera und gibt ein Bild oder eine Rundgangsprüfung aus.
     Parameter: pos=x,y,z&tgt=x,y,z (Weltkoordinaten wie View3D._view), cam=<Kamera wie goTo>, level=UG|EG|OG|DG, probe=<Rundgang>&step=10, wait=<ms> -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  img { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  pre { display: none; }
</style>
</head>
<body>
<iframe id="seite"></iframe>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search), rahmen = document.getElementById('seite'), out = document.getElementById('out');
const pause = ms => new Promise(r => setTimeout(r, ms));
const zahlen = s => s.split(',').map(Number);
rahmen.src = (q.get('src') || '../docs/index.html') + '?v=' + Date.now() + '#modell';
(async () => {
  try {
    let V = null;
    for (let i = 0; i < 900 && !(V && V.ready); i++) { await pause(100); V = rahmen.contentWindow && rahmen.contentWindow.View3D; }
    if (!(V && V.ready)) throw new Error('3D-Modell nicht bereit');
    if (q.get('fingerprint')) { out.textContent = 'FP ' + JSON.stringify(V._fingerprint()); document.title = 'fertig'; return; }
    await pause(+(q.get('wait') || 1200));
    if (q.get('level')) V.setLevel(q.get('level'));
    if (q.get('probe')) { out.textContent = 'PROBE ' + JSON.stringify(V._probe(q.get('probe'), +(q.get('step') || 10))); document.title = 'fertig'; return; }
    if (q.get('cam')) V.goTo(q.get('cam'));
    if (q.get('pos')) V._view(zahlen(q.get('pos')), zahlen(q.get('tgt')));
    // ohne Bildwechsel läuft die Schleife nicht: 1,5 s von Hand (Kamerafahrt, Licht innen/außen, Türen)
    V._frame(45);
    const bild = new Image(); bild.src = V.snapshot(); await bild.decode();
    document.body.append(bild); rahmen.style.visibility = 'hidden';
    out.textContent = 'BILD ' + bild.naturalWidth + 'x' + bild.naturalHeight; document.title = 'fertig';
  } catch (e) { out.textContent = 'FEHLER ' + e.message; document.title = 'fehler'; }
})();
</script>
</body>
</html>
